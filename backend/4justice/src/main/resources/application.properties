spring.application.name=4justice

# Local MySQL
# spring.datasource.url=jdbc:mysql://localhost:3306/4justice_db

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${LOCAL_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Aiven MySQL Cloud Database
spring.datasource.url=jdbc:mysql://mysql-331f62a4-apeel.g.aivencloud.com:20579/defaultdb?sslMode=REQUIRED

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
security.jwt.secret=${JWT_SECRET}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.contact.receiver=appeel.support@gmail.com
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# PayPal Sandbox
paypal.base-url=https://api-m.sandbox.paypal.com
paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}


payment.currency=SEK
payment.amount=99.00

payment.return-url=${app.frontend.url}/payment
payment.cancel-url=${app.frontend.url}/payment?paypal=cancel
external-invoice.return-url=${app.frontend.url}/external-invoice-payment
external-invoice.cancel-url=${app.frontend.url}/external-invoice-payment?paypal=cancel


# Supabase Storage
supabase.url=https://lyqeggwmsdptvdlaaqry.supabase.co
supabase.bucket=appeel-documents
supabase.secret-key=${SUPABASE_SECRET_KEY}

spring.config.import=optional:file:.env[.properties]

# Resend HTTPS email configuration
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from=${RESEND_FROM_EMAIL:}
app.resend.admin-email=${RESEND_ADMIN_EMAIL:appeel.support@gmail.com}






# Server
server.port=8081
