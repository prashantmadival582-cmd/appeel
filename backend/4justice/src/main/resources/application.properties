spring.application.name=4justice


# Aiven Cloud MySQL Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SSL Certificate Configuration

spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${DB_TRUSTSTORE_PATH}

spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${DB_TRUSTSTORE_PASSWORD}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=JKS

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# JWT signing secret - local development only
security.jwt.secret=${JWT_SECRET}



# ===============================
# APPEEL Gmail SMTP Configuration
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Contact form recipient
app.contact.receiver=appeel.support@gmail.com

# Frontend URL for password reset links
app.frontend.url=http://localhost:5173


# ===============================
# PayPal Sandbox Configuration
# ===============================

paypal.base-url=https://api-m.sandbox.paypal.com

paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
# Payment Configuration
# ===============================

payment.currency=SEK
payment.amount=99.00
payment.return-url=http://localhost:5173/payment
payment.cancel-url=http://localhost:5173/payment?paypal=cancel



# ===============================
# Server Configuration
# ===============================

server.port=8081
