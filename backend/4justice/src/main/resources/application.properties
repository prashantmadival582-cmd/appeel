spring.application.name=4justice

# Local MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/4justice_db

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${LOCAL_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
security.jwt.secret=${JWT_SECRET}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.contact.receiver=appeel.support@gmail.com
app.frontend.url=http://localhost:5173

# PayPal Sandbox
paypal.base-url=https://api-m.sandbox.paypal.com
paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}

payment.return-url=http://localhost:5173/payment
payment.cancel-url=http://localhost:5173/payment?paypal=cancel
payment.currency=SEK
payment.amount=99.00


# Supabase Storage
supabase.url=https://lyqeggwmsdptvdlaaqry.supabase.co
supabase.bucket=appeel-documents
supabase.secret-key=${SUPABASE_SECRET_KEY}

spring.config.import=optional:file:.env[.properties]


# External Invoice PayPal Callback URLs
external-invoice.return-url=http://localhost:5173/external-invoice-payment
external-invoice.cancel-url=http://localhost:5173/external-invoice-payment?paypal=cancel




# Server
server.port=8081